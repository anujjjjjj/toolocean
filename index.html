<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToolOcean</title>
    <meta name="description" content="ToolOcean – a fast, modern collection of developer tools" />
    <meta name="author" content="Anuj Kabra" />

    <!--
      Icons. favicon.ico exists because browsers probe /favicon.ico by
      convention whether or not it is linked; the previous one was a PNG with an
      .ico extension, so every one of those requests got a file it could not
      parse.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#e5322d" />

    <meta property="og:title" content="ToolOcean" />
    <meta property="og:description" content="ToolOcean – a fast, modern collection of developer tools." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://toolocean.co/og-default.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://toolocean.co/og-default.png" />

    <!--
      Typography: Urbanist for everything, headings and body alike, self-hosted
      from /fonts so there is no third-party origin on the critical path. No
      extra DNS lookup, no second TLS handshake, and no render-blocking
      stylesheet that has to parse before the font file is even discovered.

      Only the latin subset is preloaded. latin-ext is declared in the CSS with
      its own unicode-range and is fetched only by a reader who actually needs
      one of those characters.

      The @font-face rule lives in src/index.css.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/urbanist-latin.woff2" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

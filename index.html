<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToolOcean</title>
    <meta name="description" content="ToolOcean – a fast, modern collection of developer tools" />
    <meta name="author" content="ToolOcean" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:title" content="ToolOcean" />
    <meta property="og:description" content="ToolOcean – a fast, modern collection of developer tools." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://toolocean.co/og-default.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://toolocean.co/og-default.png" />

    <!--
      Theme before first paint. Follows the system unless a previous toggle
      stored `theme` (or the legacy `darkMode` key). Prerender stays light.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          if (saved !== "light" && saved !== "dark") {
            var legacy = localStorage.getItem("darkMode");
            if (legacy === "true") saved = "dark";
            else if (legacy === "false") saved = "light";
          }
          var dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          if (dark) root.classList.add("dark");
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <style>
      html { background: #f7f5f0; color: #1c1915; }
      html.dark { background: #171512; color: #f1ede4; }
      body { margin: 0; font-family: "Instrument Sans", "Instrument Sans Fallback", ui-sans-serif, system-ui, sans-serif; }
    </style>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/instrument-sans-latin-wght-normal.woff2" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      Cookieless Umami page views. Deferred and placed after the app module so
      a slow third-party response does not delay the tool bundle. data-domains
      limits collection to toolocean.co. The id is UMAMI_WEBSITE_ID in
      src/lib/umami.ts.
    -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="485af8d4-6328-4f5c-adb8-7c5eeabd81cb"
      data-domains="toolocean.co"
      data-do-not-track="true"
    ></script>
  </body>
</html>

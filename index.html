<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToolOcean</title>
    <meta name="description" content="ToolOcean – a fast, modern collection of developer tools" />
    <meta name="author" content="Anuj Kabra" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:title" content="ToolOcean" />
    <meta property="og:description" content="ToolOcean – a fast, modern collection of developer tools." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.svg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/favicon.svg" />

    <!--
      Typography: Instrument Sans for headings, DM Sans for body. Both are
      self-hosted from /fonts, so there is no third-party origin on the critical
      path. No extra DNS lookup, no second TLS handshake, and no render-blocking
      stylesheet that has to parse before the font files are even discovered.

      Only the latin subsets are preloaded. latin-ext is declared in the CSS with
      its own unicode-range and is fetched only by a reader who actually needs
      one of those characters.

      The @font-face rules, and the metric-matched fallbacks that stop the H1
      reflowing when the webfont swaps in, live in src/index.css.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/instrument-sans-latin.woff2"
      crossorigin
    />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/dm-sans-latin.woff2" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
